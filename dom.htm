<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="http://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="flex flex-col justify-center itmes-center p-[20px]">

    <form name="auth" id="auth">
        <label for="login">Masukan id anda</label><br>
        <input type="text" name="login" class="border-2 border-black"><br>

        <label for="pass" id="auth">Masukan password</label><br>
        <input type="password" name="pass" class="border-2 border-black"><br>

        <button id="btn" type="submit" class="border-2 border-black mt-[15px]">pencet</button>
        <h1 id="judul">start</h1>
    </form>


    <script>
        $(document).ready(function () {

            let angka = 0;

            $('#btn').click(function () {
                angka += 1;
                $('#judul').text(angka)
            })

        })
    </script>
</body>

</html>
